<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Fraud Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="my-5 text-center">
            <h1>Invoice Fraud Detection App</h1>
            <p>Upload an invoice and let us analyze its authenticity</p>
        </header>

        <div class="row">
            <div class="col-md-6 offset-md-3">
                <form id="upload-form">
                    <div class="mb-3">
                        <input type="file" class="form-control" id="file-input" accept=".pdf,.xls,.xlsx,.doc,.docx,.google-docs" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze Invoice</button>
                </form>
            </div>
        </div>

        <div id="results" class="mt-5">
            <h3>Analysis Results</h3>
            <div id="results-content"></div>
            <canvas id="analysis-chart" width="400" height="400"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
